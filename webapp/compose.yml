# Development only: builds the image from this folder (the build runs the test suite first).
# To run the app, use the published image ghcr.io/j3lte/dell3115cn-centre: see "Getting started" in the README in
# the repository root.
# Set SERVICE_URL to the scanner service, and APP_SECRET to a long random string (`openssl rand -base64 32`).
services:
  scan-webapp:
    build: .
    image: scan-webapp:dev
    ports:
      - "8080:8080"
    environment:
      SERVICE_URL: ${SERVICE_URL:?set SERVICE_URL, e.g. http://<pi-host>:8765}
      APP_SECRET: ${APP_SECRET:-}
      TZ: ${TZ:-UTC}
      # The Analyse section (tracking dots): uncomment this and the analyse service below.
      # ANALYSE_ENDPOINT: http://analyse:8770
    volumes:
      - ./data:/data
      # The scanner's colour profile (Dell's, not included; see assets/README.md) is baked in when it is in assets/
      # at build time.
      # Folder destinations write inside the container; mount the target here, e.g.:
      # - /srv/archive:/archive
    restart: unless-stopped
  # Optional: tracking-dot analysis (DEDA), GPL-3.0-or-later; see docs/ANALYSE.md in the repository root.
  # analyse:
  #   image: ghcr.io/j3lte/dell3115cn-centre-analyse:latest
  #   mem_limit: 1536m    # a 600 dpi page needs up to about 1 GiB while it is analysed
  #   restart: unless-stopped
