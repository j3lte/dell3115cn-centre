<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f2ee" />
    <script>
      // Theme before the first paint (no flash); src/web/lib/theme.ts keeps it current.
      (function () {
        var c = null;
        try {
          c = localStorage.getItem("theme");
        } catch (e) {}
        var dark = c === "dark" || (c !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#16181b");
      })();
    </script>
    <title>Dell 3115CN</title>

    <link rel="stylesheet" href="./styles.css" />
  </head>

  </body>
</html>
