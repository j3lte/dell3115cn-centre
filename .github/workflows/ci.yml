# Tests pushes and pull requests and test-builds the web app image and the analyse image, but only the parts whose
# files changed (job "changes"; a change to the workflows runs everything). Publishes the images (web app and -analyse)
# to GitHub Container Registry (linux/amd64 + linux/arm64): a release tag x.y.z (no "v") as "x.y.z" and "latest", always
# both images; every other push to main as "build-<short commit hash>", only the images whose folder changed. A manual
# run (workflow_dispatch) runs everything. The release workflow (release.yml) starts it on a new tag with
# workflow_dispatch, because a tag pushed by a workflow does not trigger the push event.
name: CI

on:
  push:
    branches: [main]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Which parts changed. Release tags, manual runs and workflow changes count as "everything changed".
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      scanner-service: ${{ steps.all.outputs.all == 'true' || steps.paths.outputs.workflows == 'true' || steps.paths.outputs.scanner-service == 'true' }}
      cups: ${{ steps.all.outputs.all == 'true' || steps.paths.outputs.workflows == 'true' || steps.paths.outputs.cups == 'true' }}
      tools: ${{ steps.all.outputs.all == 'true' || steps.paths.outputs.workflows == 'true' || steps.paths.outputs.tools == 'true' }}
      webapp: ${{ steps.all.outputs.all == 'true' || steps.paths.outputs.workflows == 'true' || steps.paths.outputs.webapp == 'true' }}
      analyse: ${{ steps.all.outputs.all == 'true' || steps.paths.outputs.workflows == 'true' || steps.paths.outputs.analyse == 'true' }}
      images: ${{ steps.images.outputs.images }}
      builds: ${{ steps.images.outputs.builds }}
    steps:
      - id: all
        run: echo "all=${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.all.outputs.all != 'true'
      - id: paths
        if: steps.all.outputs.all != 'true'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            workflows: [".github/workflows/**"]
            scanner-service: ["scanner-service/**"]
            cups: ["cups/**"]
            tools: ["tools/**"]
            webapp: ["webapp/**"]
            analyse: ["analyse/**"]
      # The images to build and publish: matrices for the image job (one entry per image and platform) and the publish
      # job (one per image). The analyse image is GPL-3.0-or-later, not the repository's Apache-2.0.
      - id: images
        env:
          ALL: ${{ steps.all.outputs.all == 'true' || steps.paths.outputs.workflows == 'true' }}
          WEBAPP: ${{ steps.paths.outputs.webapp }}
          ANALYSE: ${{ steps.paths.outputs.analyse }}
        run: |
          webapp='{"component":"webapp","suffix":"","licenses":"","title":"","description":""}'
          analyse='{"component":"analyse","suffix":"-analyse","licenses":"GPL-3.0-or-later","title":"dell3115cn-centre-analyse","description":"DEDA tracking-dot analysis for the Dell 3115cn Centre web app"}'
          images='[]'
          if [ "$ALL" = true ] || [ "$WEBAPP" = true ]; then images=$(jq -c --argjson i "$webapp" '. + [$i]' <<< "$images"); fi
          if [ "$ALL" = true ] || [ "$ANALYSE" = true ]; then images=$(jq -c --argjson i "$analyse" '. + [$i]' <<< "$images"); fi
          platforms='[{"arch":"amd64","platform":"linux/amd64","runner":"ubuntu-24.04"},{"arch":"arm64","platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]'
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "builds=$(jq -c --argjson p "$platforms" '[.[] as $i | $p[] | $i + .]' <<< "$images")" >> "$GITHUB_OUTPUT"

  # The print server's environment: Debian 12 on arm64 (Python 3.11, Ghostscript 10.0, as on a Raspberry Pi).
  scanner-service:
    needs: changes
    if: needs.changes.outputs.scanner-service == 'true'
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    steps:
      - uses: actions/checkout@v7
      - run: apt-get update && apt-get install -y --no-install-recommends python3 python3-pytest python3-usb
      - run: python3 -m pytest -q
        working-directory: scanner-service

  cups:
    needs: changes
    if: needs.changes.outputs.cups == 'true'
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    steps:
      - uses: actions/checkout@v7
      - run: apt-get update && apt-get install -y --no-install-recommends python3 python3-pytest ghostscript
      - run: python3 -m pytest -q cups/tests

  tools:
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    steps:
      - uses: actions/checkout@v7
      - run: apt-get update && apt-get install -y --no-install-recommends python3 python3-pytest git
      - run: python3 -m pytest -q tools/tests

  webapp:
    needs: changes
    if: needs.changes.outputs.webapp == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Typecheck
        working-directory: webapp
        run: bun install --frozen-lockfile && bunx tsc --noEmit -p .
      - uses: docker/setup-buildx-action@v4
      # The image's "test" stage runs the whole suite on Debian (ImageMagick, Tesseract, smbclient);
      # the runtime stage only builds when it passes.
      - name: Test and build the image
        uses: docker/build-push-action@v7
        with:
          context: webapp
          push: false
          cache-from: type=gha,scope=webapp-amd64
          cache-to: type=gha,mode=max,scope=webapp-amd64

  # DEDA analysis service (GPL-3.0-or-later): the image's "test" stage runs its pytest suite; the runtime stage copies a
  # marker from it, so a plain build of the image runs the tests too.
  analyse:
    needs: changes
    if: needs.changes.outputs.analyse == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Test and build the analyse image
        run: docker build analyse

  # Publish (tags and main, not pull requests): build each platform on a native runner, push by digest, then tag one multi-platform image.
  # Skipped test jobs (nothing changed there) don't block it; a failed one does.
  image:
    if: >-
      !cancelled() && !failure() && needs.changes.outputs.images != '[]' && github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    needs: [changes, scanner-service, cups, tools, webapp, analyse]
    strategy:
      fail-fast: false # a broken analyse leg must not cancel the web app legs
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.builds) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Lower-case image name
        run: echo "IMAGE=${IMAGE,,}${SUFFIX}" >> "$GITHUB_ENV"
        env:
          SUFFIX: ${{ matrix.suffix }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The analyse image is GPL-3.0-or-later, not the repository's Apache-2.0: override the labels taken from the repository.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          labels: |
            ${{ matrix.licenses != '' && format('org.opencontainers.image.licenses={0}', matrix.licenses) || '' }}
            ${{ matrix.title != '' && format('org.opencontainers.image.title={0}', matrix.title) || '' }}
            ${{ matrix.description != '' && format('org.opencontainers.image.description={0}', matrix.description) || '' }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.arch }}
      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.component }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    if: >-
      !cancelled() && !failure() && needs.changes.outputs.images != '[]' && github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    needs: [changes, image]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.images) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Lower-case image name
        run: echo "IMAGE=${IMAGE,,}${SUFFIX}" >> "$GITHUB_ENV"
        env:
          SUFFIX: ${{ matrix.suffix }}
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.component }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Release tag x.y.z: "x.y.z" + "latest". Push to main: "build-<short commit hash>". The OCI annotations (description
      # from the repository's, source, licence) go on the multi-platform index, where the package page reads them.
      - id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,prefix=build-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
          # The analyse image is GPL-3.0-or-later, not the repository's Apache-2.0; empty for the web app (keeps the defaults).
          annotations: |
            ${{ matrix.licenses != '' && format('org.opencontainers.image.licenses={0}', matrix.licenses) || '' }}
            ${{ matrix.title != '' && format('org.opencontainers.image.title={0}', matrix.title) || '' }}
            ${{ matrix.description != '' && format('org.opencontainers.image.description={0}', matrix.description) || '' }}
      - name: Create the multi-platform image
        working-directory: ${{ runner.temp }}/digests
        run: |
          args=()
          while read -r tag; do args+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          while read -r a; do args+=(--annotation "$a"); done < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do args+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"
      - name: Inspect
        run: docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"

  # Release tag x.y.z, once its image is published: CHANGELOG.md's [Unreleased] section becomes the release (heading
  # linked to the comparison with the previous release) and its items become the GitHub release notes.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # main, not the tag: the changelog commit goes on main. The full history brings every tag.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Release the [Unreleased] section
        run: python3 tools/changelog.py "$GITHUB_REF_NAME" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" > "$RUNNER_TEMP/notes.md"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi
      # Pushed with GITHUB_TOKEN, so this commit does not start another CI run.
      - name: Commit CHANGELOG.md to main
        run: |
          git add CHANGELOG.md
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "docs(changelog): $GITHUB_REF_NAME"
          git push origin HEAD:main
